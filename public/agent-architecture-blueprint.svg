<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0D091A"/>
      <stop offset="100%" stop-color="#140D26"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(147, 51, 234, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  <rect width="1200" height="700" fill="url(#gridPattern)"/>

  <!-- Glow effect -->
  <circle cx="600" cy="350" r="280" fill="#7C3AED" opacity="0.12" filter="blur(80px)"/>

  <!-- Outer Frame -->
  <rect x="40" y="40" width="1120" height="620" rx="24" fill="rgba(17, 16, 25, 0.75)" stroke="rgba(196, 155, 255, 0.25)" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="40" y="40" width="1120" height="70" rx="24" fill="rgba(0, 0, 0, 0.4)"/>
  <circle cx="75" cy="75" r="6" fill="#EF4444"/>
  <circle cx="95" cy="75" r="6" fill="#F59E0B"/>
  <circle cx="115" cy="75" r="6" fill="#10B981"/>
  <text x="145" y="81" fill="#FAFAFA" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">AHMIXEN // AUTONOMOUS AGENT ORCHESTRATION BLUEPRINT</text>
  <rect x="980" y="60" width="150" height="30" rx="15" fill="rgba(124, 58, 237, 0.2)" stroke="rgba(196, 155, 255, 0.3)" stroke-width="1"/>
  <text x="1010" y="80" fill="#D8B4FE" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">PRODUCTION v2.6</text>

  <!-- Diagram Architecture Nodes -->
  
  <!-- Node 1: User Objective -->
  <g transform="translate(80, 160)">
    <rect width="220" height="130" rx="16" fill="#111019" stroke="rgba(196, 155, 255, 0.3)" stroke-width="1.5"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="rgba(124, 58, 237, 0.2)"/>
    <text x="25" y="39" fill="#C084FC" font-size="18">🎯</text>
    <text x="64" y="38" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Objective Input</text>
    <text x="16" y="75" fill="#B8B5C4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Natural Language Goal</text>
    <text x="16" y="95" fill="#A855F7" font-family="monospace" font-size="11">context_window: 200k</text>
    <text x="16" y="112" fill="#10B981" font-family="monospace" font-size="10">● Trigger: Webhook / API</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 300 225 L 370 225" stroke="#9333EA" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <polygon points="375,225 365,220 365,230" fill="#9333EA"/>

  <!-- Node 2: Reasoning Core -->
  <g transform="translate(380, 140)">
    <rect width="260" height="170" rx="20" fill="#161424" stroke="url(#purpleGrad)" stroke-width="2"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="rgba(147, 51, 234, 0.25)"/>
    <text x="31" y="46" fill="#D8B4FE" font-size="20">⚡</text>
    <text x="72" y="44" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">Agent Reasoning Loop</text>
    <text x="20" y="85" fill="#B8B5C4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Chain of Thought &amp; Reflection</text>
    <text x="20" y="108" fill="#D8B4FE" font-family="monospace" font-size="11">› parse_schema(output="JSON")</text>
    <text x="20" y="128" fill="#D8B4FE" font-family="monospace" font-size="11">› evaluate_subtasks()</text>
    <text x="20" y="148" fill="#10B981" font-family="monospace" font-size="11">✓ Zero-Hallucination Guard</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 640 225 L 710 225" stroke="#9333EA" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <polygon points="715,225 705,220 705,230" fill="#9333EA"/>

  <!-- Node 3: Tool Calling & APIs -->
  <g transform="translate(720, 140)">
    <rect width="240" height="170" rx="18" fill="#111019" stroke="rgba(196, 155, 255, 0.3)" stroke-width="1.5"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="rgba(124, 58, 237, 0.2)"/>
    <text x="31" y="46" fill="#C084FC" font-size="20">🛠️</text>
    <text x="70" y="44" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Tool Execution Engine</text>
    <text x="20" y="85" fill="#B8B5C4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">n8n / API Webhooks</text>
    <text x="20" y="108" fill="#C084FC" font-family="monospace" font-size="11">• search_web() [120ms]</text>
    <text x="20" y="128" fill="#C084FC" font-family="monospace" font-size="11">• run_code_sandbox()</text>
    <text x="20" y="148" fill="#C084FC" font-family="monospace" font-size="11">• dispatch_notification()</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 960 225 L 1000 225 L 1000 370 L 600 370" stroke="#9333EA" stroke-width="2" fill="none"/>

  <!-- Node 4: Synthesis & Output Delivery -->
  <g transform="translate(380, 410)">
    <rect width="440" height="150" rx="20" fill="#111019" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="30" y="47" fill="#10B981" font-size="22">🚀</text>
    <text x="75" y="46" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">Production Output &amp; Deployment</text>
    <text x="20" y="85" fill="#B8B5C4" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Verified Structured JSON, Automated CRM/Slack Dispatch &amp; Live Web Tool</text>
    <text x="20" y="112" fill="#10B981" font-family="monospace" font-size="12">STATUS: COMPLETED (99.8% ACCURACY) • LATENCY: 840ms</text>
    <text x="20" y="132" fill="#A855F7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Integrated with Claude 3.7 Sonnet + OpenAI GPT-4o Tool Architecture</text>
  </g>

  <!-- Arrow 4 return loop -->
  <path d="M 380 485 L 200 485 L 200 300" stroke="rgba(196, 155, 255, 0.2)" stroke-dasharray="4,4" stroke-width="1.5" fill="none"/>
  <text x="210" y="400" fill="#B8B5C4" font-family="monospace" font-size="10">Auto-Feedback Loop</text>

  <!-- Bottom Brand Watermark -->
  <text x="80" y="620" fill="rgba(255, 255, 255, 0.4)" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">AhmiXen Live Workshop Blueprint // Module 02 &amp; 03</text>
  <text x="1000" y="620" fill="#9333EA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">ahmixen.com</text>
</svg>
